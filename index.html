<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi QR Code Guru & Karyawan</title>
  
  <!-- Library Scanner QR Code (HTML5-QRCode) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1120;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Jam Digital & Tanggal */
    .time-card {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .time-card .clock {
      font-size: 26px;
      font-weight: bold;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .time-card .date {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Box Kamera Scanner */
    .scanner-box {
      position: relative;
      background-color: #000000;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    #reader video {
      object-fit: cover;
    }

    /* Overlay Pesan Kegagalan Kamera */
    .camera-error-overlay {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      color: #f87171;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
      width: 90%;
      justify-content: center;
    }

    /* Tombol Upload Foto QR */
    .btn-file {
      display: block;
      width: 100%;
      background-color: #06b6d4;
      color: #ffffff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: none;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .btn-file:hover {
      background-color: #0891b2;
    }

    /* Form Input Manual ID */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .input-group input {
      flex: 1;
      background-color: #0d1527;
      border: 1px solid #1e293b;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .input-group button {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .input-group button:hover {
      background-color: #059669;
    }

    /* Alert Banner Status Scan */
    .alert-banner {
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 15px;
    }

    .alert-banner.danger {
      background-color: #991b1b;
      color: #fecaca;
    }

    .alert-banner.success {
      background-color: #065f46;
      color: #a7f3d0;
    }

    .alert-banner.info {
      background-color: #1e3a8a;
      color: #bfdbfe;
    }

    /* Detail Hasil Scan */
    .details-card {
      background-color: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 16px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #1e293b;
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row span:first-child {
      color: #94a3b8;
    }

    .detail-row span:last-child {
      color: #ffffff;
      font-weight: 500;
    }

    /* Input File Asli Di-hide */
    #qr-input-file {
      display: none;
    }

    /* ===== LOGIN GURU / KARYAWAN ===== */
    .login-screen {
      width: 100%;
      max-width: 480px;
      background-color: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-screen h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
      font-size: 22px;
    }
    .login-screen .login-subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .login-form-group { margin-bottom: 14px; }
    .login-form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .login-form-group input {
      width: 100%;
      background-color: #0d1527;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .login-form-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56,189,248,0.12);
    }
    .login-button {
      width: 100%;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }
    .login-button:hover { background-color: #059669; }
    .login-button:disabled { opacity: 0.65; cursor: not-allowed; }
    .login-error {
      display: none;
      background-color: #991b1b;
      color: #fecaca;
      border: 1px solid #b91c1c;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 14px;
    }
    .scanner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .scanner-user {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.35;
    }
    .logout-button {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .logout-button:hover { background: #b91c1c; }

  </style>
</head>
<body>

  <!-- LOGIN SELALU MUNCUL SAAT URL SCANNER DIBUKA -->
  <div class="login-screen" id="login-screen">
    <h2>🔐 Login Scanner</h2>
    <div class="login-subtitle">Presensi Guru & Karyawan SMP Yanuri</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form" onsubmit="loginScanner(event)">
      <div class="login-form-group">
        <label for="login-id">ID Guru / Karyawan</label>
        <input type="text" id="login-id" autocomplete="off"
               placeholder="Contoh: ynr-002" required>
      </div>

      <div class="login-form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" autocomplete="username"
               placeholder="Masukkan username" required>
      </div>

      <div class="login-form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password"
               placeholder="Masukkan password" required>
      </div>

      <button type="submit" class="login-button" id="login-button">🔓 LOGIN</button>
    </form>
  </div>

  <div class="container" id="scanner-app" style="display:none;">
    
    <!-- Jam & Tanggal -->
    <div class="time-card">
      <div class="clock" id="clock">00:00:00 WIB</div>
      <div class="date" id="date">Memuat tanggal...</div>
    </div>

    <!-- Area Video Kamera -->
    <div class="scanner-box">
      <div id="reader"></div>
      <div class="camera-error-overlay" id="camera-error">
        ❌ Kamera tidak dapat diaktifkan
      </div>
    </div>

    <!-- Tombol Foto QR Code -->
    <label for="qr-input-file" class="btn-file">
      📷 FOTO QR CODE
    </label>
    <input type="file" id="qr-input-file" accept="image/*">

    <!-- Input Manual ID / NIP -->
    <div class="input-group">
      <input type="text" id="manual-id" placeholder="Atau ketik ID Guru/Karyawan...">
      <button onclick="kirimManual()">Kirim</button>
    </div>

    <!-- Banner Status Alert -->
    <div class="alert-banner danger" id="status-banner">
      ❌ Kamera diblokir / tidak tersedia
    </div>

    <!-- Detail Informasi -->
    <div class="details-card">
      <div class="detail-row">
        <span>ID Guru/Karyawan:</span>
        <span id="res-id">-</span>
      </div>
      <div class="detail-row">
        <span>Nama Lengkap:</span>
        <span id="res-nama">-</span>
      </div>
      <div class="detail-row">
        <span>Jabatan:</span>
        <span id="res-jabatan">-</span>
      </div>
      <div class="detail-row">
        <span>Waktu Scan:</span>
        <span id="res-waktu">-</span>
      </div>
    </div>

  </div>

  <script>
    // URL Web App Google Apps Script Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbwIbDpg_YFoz-XTVB9evYxmGqysLv4WvvHR8UMHnHZN90fL02jdFFzDZ_u-YzelHEU/exec";

    let html5QrCode = null;
    let isProcessing = false;
    let authToken = "";
    let loggedUser = null;


    // ===== LOGIN SCANNER =====
    function tampilkanLogin() {
      document.getElementById("login-screen").style.display = "block";
      document.getElementById("scanner-app").style.display = "none";
      setTimeout(function() {
        document.getElementById("login-id").focus();
      }, 50);
    }

    function tampilkanScanner(userData, loginId) {
      loggedUser = userData || {};
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("scanner-app").style.display = "block";

      document.getElementById("logged-user").innerText =
        loggedUser.nama || loggedUser.name || loggedUser.username || "Pengguna";
      document.getElementById("logged-id").innerText =
        "ID: " + (loggedUser.id || loginId);

      // Kamera baru boleh aktif setelah login berhasil.
      startCamera();
    }

    function loginScanner(event) {
      event.preventDefault();

      var id = document.getElementById("login-id").value.trim();
      var username = document.getElementById("login-username").value.trim();
      var password = document.getElementById("login-password").value;

      var errorBox = document.getElementById("login-error");
      var button = document.getElementById("login-button");

      errorBox.style.display = "none";

      if (!id || !username || !password) {
        errorBox.innerText = "ID, username, dan password wajib diisi.";
        errorBox.style.display = "block";
        return;
      }

      button.disabled = true;
      button.innerText = "⏳ MEMERIKSA...";

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "loginPiket",
          id: id,
          username: username,
          password: password
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.success && data.token) {
          authToken = data.token;

          var userData = data.data || data.user || {
            id: id,
            username: username
          };

          document.getElementById("login-password").value = "";
          tampilkanScanner(userData, id);
        } else {
          errorBox.innerText =
            (data && data.message)
              ? data.message
              : "Login gagal. Periksa ID, username, dan password.";
          errorBox.style.display = "block";
        }
      })
      .catch(function(err) {
        console.error("Login scanner error:", err);
        errorBox.innerText =
          "❌ Gagal terhubung ke server Apps Script.";
        errorBox.style.display = "block";
      })
      .finally(function() {
        button.disabled = false;
        button.innerText = "🔓 LOGIN";
      });
    }

    async function logoutScanner() {
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
        } catch (e) {
          console.warn("Kamera sudah berhenti / tidak aktif:", e);
        }
        html5QrCode = null;
      }

      if (authToken) {
        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "logoutPiket",
              token: authToken
            })
          });
        } catch (e) {
          console.warn("Logout server gagal:", e);
        }
      }

      authToken = "";
      loggedUser = null;
      document.getElementById("login-form").reset();
      document.getElementById("login-error").style.display = "none";
      tampilkanLogin();
    }

    // 1. Fungsi Update Jam & Tanggal Digital
    function updateClock() {
      const now = new Date();
      
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      const detik = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("clock").innerText = `${jam}:${menit}:${detik} WIB`;

      const opsiTanggal = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById("date").innerText = now.toLocaleDateString('id-ID', opsiTanggal);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Inisialisasi Kamera Pemindai
    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        document.getElementById("camera-error").style.display = "none";
        setStatusBanner("info", "🔍 Kamera aktif, arahkan QR Code ke kotak scan");
      }).catch(err => {
        console.error("Gagal Buka Kamera:", err);
        document.getElementById("camera-error").style.display = "flex";
        setStatusBanner("danger", "❌ Kamera diblokir / tidak tersedia");
      });
    }

    // 3. Callback saat QR Terbaca
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      prosesKirimAbsensi(decodedText);
    }

    // 4. Handle Input Foto Gambar QR
    document.getElementById('qr-input-file').addEventListener('change', e => {
      if (e.target.files.length === 0) return;
      const imageFile = e.target.files[0];
      
      setStatusBanner("info", "⏳ Membaca gambar QR Code...");
      
      const html5QrCodeFile = new Html5Qrcode("reader");
      html5QrCodeFile.scanFile(imageFile, true)
        .then(decodedText => {
          prosesKirimAbsensi(decodedText);
        })
        .catch(err => {
          setStatusBanner("danger", "❌ QR Code tidak terdeteksi pada foto!");
        });
    });

    // 5. Handle Kirim Manual via Form
    function kirimManual() {
      if (!authToken) {
        tampilkanLogin();
        return;
      }

      const idInput = document.getElementById("manual-id").value.trim();
      if (!idInput) {
        alert("Masukkan ID / NIP terlebih dahulu!");
        return;
      }
      prosesKirimAbsensi(idInput);
    }

    // 6. Pembersih Teks Hasil Scan (Ekstraksi ID jika isi QR berupa URL)
    function ekstraksiIdBersih(textScan) {
      if (!textScan) return "";
      
      if (textScan.includes("data=")) {
        var parts = textScan.split("data=");
        return decodeURIComponent(parts[1]);
      }
      
      if (textScan.startsWith("http://") || textScan.startsWith("https://")) {
        var cleanUrl = textScan.split('?')[0];
        var pathParts = cleanUrl.split('/');
        return pathParts[pathParts.length - 1];
      }

      return textScan.trim();
    }

    // 7. Fungsi Kirim Data ke API Apps Script
    function prosesKirimAbsensi(idScan) {
      if (!authToken) {
        tampilkanLogin();
        return;
      }

      var idBersih = ekstraksiIdBersih(idScan);
      
      setStatusBanner("info", "⏳ Mengirim data absensi (" + idBersih + ")...");

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "scan",
          token: authToken,
          id: idBersih
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          setStatusBanner("success", "✅ " + data.message);
          document.getElementById("res-id").innerText = idBersih;
          document.getElementById("res-nama").innerText = data.data.nama;
          document.getElementById("res-jabatan").innerText = data.data.jabatan;
          document.getElementById("res-waktu").innerText = data.data.waktu;
          document.getElementById("manual-id").value = "";
        } else {
          setStatusBanner("danger", "❌ " + data.message);
          document.getElementById("res-id").innerText = idBersih;
          document.getElementById("res-nama").innerText = "-";
          document.getElementById("res-jabatan").innerText = "-";
          document.getElementById("res-waktu").innerText = "-";
        }
      })
      .catch(err => {
        console.error(err);
        setStatusBanner("danger", "❌ Gagal terhubung ke server Apps Script!");
      })
      .finally(() => {
        setTimeout(() => { isProcessing = false; }, 3000);
      });
    }

    // 8. Helper Ubah Tampilan Banner Status
    function setStatusBanner(type, message) {
      const banner = document.getElementById("status-banner");
      banner.className = "alert-banner " + type;
      banner.innerText = message;
    }

    // URL Scanner selalu dimulai dari LOGIN.
    window.addEventListener("DOMContentLoaded", function() {
      tampilkanLogin();
    });
  </script>

</body>
</html>
